<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Ridax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ridax: {
                            DEFAULT: '#1b7a39',
                            dark: '#135c29',
                            light: '#e8f3ec',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f2f2f2] text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100">
        <div class="max-w-[1400px] mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-3xl font-black text-ridax tracking-tighter flex items-center gap-1">
                <i class="fa-solid fa-leaf text-2xl"></i> RIDAX
            </a>
            <div class="flex items-center gap-6">
                <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-ridax flex items-center gap-2 transition">
                    <i class="fa-solid fa-arrow-left"></i> Back to Store
                </a>
                <button onclick="logoutUser()" class="text-sm font-bold text-red-500 hover:text-red-700 transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Dashboard Content -->
    <main class="flex-1 max-w-[1000px] mx-auto w-full px-4 py-10">
        
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">My Account</h1>
            <p class="text-sm text-gray-500">Manage your profile and track your orders.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Profile Card -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 md:col-span-1 h-fit">
                <div class="flex items-center justify-center w-16 h-16 bg-ridax-light text-ridax rounded-full mb-4 mx-auto">
                    <i class="fa-solid fa-user text-2xl"></i>
                </div>
                <h2 id="dash-name" class="text-lg font-bold text-center text-gray-900 mb-1">Loading...</h2>
                <p id="dash-email" class="text-xs text-center text-gray-500 mb-6">...</p>

                <div class="space-y-4 border-t pt-4">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase block mb-1">Phone Number</label>
                        <p id="dash-phone" class="text-sm font-medium text-gray-800">...</p>
                    </div>
                </div>
            </div>

            <!-- Orders & Activity -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 md:col-span-2">
                <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Recent Orders</h3>
                
                <!-- Placeholder for when we connect the Python backend -->
                <div class="flex flex-col items-center justify-center py-12 text-gray-400">
                    <i class="fa-solid fa-box-open text-4xl mb-3 text-gray-300"></i>
                    <p class="text-sm">You have no recent orders.</p>
                    <a href="index.html" class="mt-4 bg-ridax text-white px-6 py-2 rounded text-sm font-bold hover:bg-ridax-dark transition">Start Shopping</a>
                </div>
            </div>

        </div>
    </main>

    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://gvhptxabpbpnabmxnuix.supabase.co';
        const supabaseAnonKey = 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        async function loadDashboard() {
            // 1. Verify user is actually logged in
            const { data: { user }, error: authError } = await supabase.auth.getUser();
            
            // If not logged in, kick them back to login page
            if (authError || !user) {
                window.location.href = 'login.html';
                return;
            }

            // 2. Fetch their details from the database
            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            // 3. Populate the dashboard UI
            if (profile) {
                document.getElementById('dash-name').innerText = profile.full_name || 'No Name Provided';
                document.getElementById('dash-phone').innerText = profile.phone || 'No Phone Provided';
            }
            document.getElementById('dash-email').innerText = user.email;
        }

        async function logoutUser() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // Run immediately when page loads
        loadDashboard();
    </script>
</body>
</html>
