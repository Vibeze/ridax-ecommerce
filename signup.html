<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PestZap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { ridax: { DEFAULT: '#1b7a39', dark: '#135c29' } } } } }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10 px-4 relative">

    <!-- PREMIUM TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-black text-ridax tracking-tighter flex items-center justify-center gap-1 mb-2">
                <i class="fa-solid fa-leaf text-2xl"></i> RIDAX
            </a>
            <h2 class="text-xl font-bold text-gray-800">Create your account</h2>
            <p class="text-sm text-gray-500 mt-1">Join to track orders and get faster checkouts.</p>
        </div>

        <form id="signupForm" onsubmit="window.handleSignup(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label>
                <input type="text" id="fullName" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Phone Number</label>
                <input type="tel" id="phone" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-ridax hover:bg-ridax-dark text-white font-bold py-3 rounded text-sm uppercase transition shadow-md mt-2">
                Create Account
            </button>
        </form>

        <div class="mt-6 flex items-center">
            <div class="flex-1 border-t border-gray-200"></div>
            <span class="px-3 text-xs text-gray-400 uppercase font-bold">Or continue with</span>
            <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <button onclick="window.loginWithGoogle()" class="mt-6 w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-bold py-2.5 rounded text-sm transition shadow-sm">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Sign up with Google
        </button>

        <div class="mt-8 text-center text-sm text-gray-600">
            Already have an account? <a href="login.html" class="text-ridax font-bold hover:underline">Log in</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            
            toast.className = `${bgColor} text-white px-5 py-3.5 rounded shadow-2xl transform transition-all duration-300 translate-x-full opacity-0 flex items-center gap-3 border-l-4 border-white/30`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-bold tracking-wide">${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        };

        let dbClient = null;
        if (window.supabase) {
            dbClient = window.supabase.createClient('https://gvhptxabpbpnabmxnuix.supabase.co', 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX');
        }

        window.handleSignup = async function(e) {
            e.preventDefault();
            if (!dbClient) return window.showToast("Database connection failed. Please refresh.", "error");
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { data: authData, error: authError } = await dbClient.auth.signUp({
                    email: email, password: password
                });

                if (authError) throw authError;

                if (authData.user) {
                    await dbClient.from('profiles').insert([{ 
                        id: authData.user.id, full_name: name, phone: phone 
                    }]);
                }

                window.showToast("Account created successfully! Redirecting...");
                
                // Wait 2 seconds so the user can read the premium toast before redirecting
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (err) {
                console.error("Signup error:", err.message);
                window.showToast(err.message, "error");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.loginWithGoogle = async function() {
            if (!dbClient) return;
            const { data, error } = await dbClient.auth.signInWithOAuth({ provider: 'google' });
            if (error) window.showToast("Google Sign-In is not yet configured.", "error");
        };
    </script>
</body>
</html>
