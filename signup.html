<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Ridax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ridax: {
                            DEFAULT: '#1b7a39',
                            dark: '#135c29',
                            light: '#e8f3ec',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f2f2f2] text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Minimal Header -->
    <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100">
        <div class="max-w-[1400px] mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-3xl font-black text-ridax tracking-tighter flex items-center gap-1">
                <i class="fa-solid fa-leaf text-2xl"></i> RIDAX
            </a>
            <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-ridax flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Back to Store
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4 py-12">
        <div class="bg-white p-8 sm:p-10 rounded-lg shadow-lg w-full max-w-md border border-gray-100">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Create your account</h1>
                <p class="text-sm text-gray-500">Join Ridax to manage orders and track deliveries.</p>
            </div>

            <form id="signup-form" class="space-y-5">
                <div>
                    <label for="fullName" class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label>
                    <input type="text" id="fullName" required class="w-full border border-gray-300 rounded-md px-4 py-2.5 text-sm focus:border-ridax focus:ring-1 focus:ring-ridax outline-none transition" placeholder="John Doe">
                </div>

                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full border border-gray-300 rounded-md px-4 py-2.5 text-sm focus:border-ridax focus:ring-1 focus:ring-ridax outline-none transition" placeholder="john@example.com">
                </div>

                <div>
                    <label for="phone" class="block text-xs font-bold text-gray-700 uppercase mb-1">Phone Number</label>
                    <input type="tel" id="phone" required class="w-full border border-gray-300 rounded-md px-4 py-2.5 text-sm focus:border-ridax focus:ring-1 focus:ring-ridax outline-none transition" placeholder="08012345678">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                    <input type="password" id="password" required class="w-full border border-gray-300 rounded-md px-4 py-2.5 text-sm focus:border-ridax focus:ring-1 focus:ring-ridax outline-none transition" placeholder="••••••••">
                    <p class="text-xs text-gray-500 mt-2">Must be at least 6 characters.</p>
                </div>

                <button type="submit" class="w-full bg-ridax hover:bg-ridax-dark text-white font-bold py-3.5 rounded-md text-sm uppercase transition shadow-md flex items-center justify-center gap-2 mt-2">
                    Create Account
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-600">
                    Already have an account? 
                    <a href="login.html" class="font-bold text-ridax hover:text-ridax-dark transition">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Utilizing your provided credentials
        const supabaseUrl = 'https://gvhptxabpbpnabmxnuix.supabase.co';
        const supabaseAnonKey = 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';
            btn.disabled = true;

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                alert("Error: " + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
                return;
            }

            if (data.user) {
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([{ id: data.user.id, full_name: fullName, phone: phone }]);

                if (profileError) {
                    console.error("Error saving profile:", profileError.message);
                }
                
                // Redirect on success
                window.location.href = "index.html"; 
            }
        });
    </script>
</body>
</html>
