<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Ridax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ridax: { DEFAULT: '#1b7a39', dark: '#135c29' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10 px-4">

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-black text-ridax tracking-tighter flex items-center justify-center gap-1 mb-2">
                <i class="fa-solid fa-leaf text-2xl"></i> RIDAX
            </a>
            <h2 class="text-xl font-bold text-gray-800">Create your account</h2>
            <p class="text-sm text-gray-500 mt-1">Join to track orders and get faster checkouts.</p>
        </div>

        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label>
                <input type="text" id="fullName" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Phone Number</label>
                <input type="tel" id="phone" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-ridax hover:bg-ridax-dark text-white font-bold py-3 rounded text-sm uppercase transition shadow-md mt-2">
                Create Account
            </button>
        </form>

        <div class="mt-6 flex items-center">
            <div class="flex-1 border-t border-gray-200"></div>
            <span class="px-3 text-xs text-gray-400 uppercase font-bold">Or continue with</span>
            <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <!-- GOOGLE AUTH BUTTON -->
        <button onclick="loginWithGoogle()" class="mt-6 w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-bold py-2.5 rounded text-sm transition shadow-sm">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Sign up with Google
        </button>

        <div class="mt-8 text-center text-sm text-gray-600">
            Already have an account? <a href="login.html" class="text-ridax font-bold hover:underline">Log in</a>
        </div>
    </div>

    <!-- SUPABASE ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient('https://gvhptxabpbpnabmxnuix.supabase.co', 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX');

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            try {
                // 1. Create the user in Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                // 2. Save their profile details to the database so we can greet them
                if (authData.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([{ 
                            id: authData.user.id, 
                            full_name: name,
                            phone: phone 
                        }]);
                    
                    if (profileError) console.warn("Profile creation note:", profileError.message);
                }

                alert("Account created successfully! Redirecting to the store...");
                window.location.href = "index.html";

            } catch (err) {
                console.error("Signup error:", err.message);
                alert("Error: " + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function loginWithGoogle() {
            // The code is ready, waiting for Phase 2 API Keys
            const { data, error } = await supabase.auth.signInWithOAuth({ provider: 'google' });
            if (error) alert("Google Sign-In is not yet configured in the Cloud Console.");
        }
    </script>
</body>
</html>
