<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Ridax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ridax Brand Color */
        .bg-ridax-green { background-color: #16a34a; }
        .text-ridax-green { color: #16a34a; }
        .border-ridax-green { border-color: #16a34a; }
        .hover-bg-ridax-dark:hover { background-color: #15803d; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-ridax-green flex items-center justify-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                RIDAX
            </h1>
            <p class="text-gray-500 text-sm mt-2">Create your account to start ordering.</p>
        </div>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-4">
            
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="fullName" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-ridax-green focus:border-ridax-green shadow-sm text-sm" placeholder="John Doe">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-ridax-green focus:border-ridax-green shadow-sm text-sm" placeholder="john@example.com">
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                <input type="tel" id="phone" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-ridax-green focus:border-ridax-green shadow-sm text-sm" placeholder="08012345678">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-ridax-green focus:border-ridax-green shadow-sm text-sm" placeholder="••••••••">
                <p class="text-xs text-gray-500 mt-1">Must be at least 6 characters.</p>
            </div>

            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-ridax-green hover-bg-ridax-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 mt-6 transition duration-150">
                Create Account
            </button>
        </form>

        <!-- Login Redirect -->
        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account? 
            <a href="login.html" class="font-medium text-ridax-green hover:text-green-700 transition duration-150">Log in here</a>
        </p>
    </div>
<!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Connect to your specific database
        // REPLACE THESE WITH YOUR ACTUAL URL AND 'ANON' KEY
        const supabaseUrl = https://gvhptxabpbpnabmxnuix.supabase.co/rest/v1/;
        const supabaseAnonKey = 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // 2. Listen for the user clicking "Create Account"
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stops the page from refreshing
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Creating Account... Please wait.";

            // Grab what the user typed
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            // 3. Send email and password to Supabase Auth
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                alert("Error: " + error.message);
                btn.innerText = originalText;
                return;
            }

            // 4. If signup works, save Name and Phone to our new profiles table
            if (data.user) {
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([
                        { 
                            id: data.user.id, 
                            full_name: fullName, 
                            phone: phone 
                        }
                    ]);

                if (profileError) {
                    console.error("Error saving profile:", profileError.message);
                }

                // 5. Success! Send them back to the main store to shop
                window.location.href = "index.html"; 
            }
        });
    </script>
</body>
</html>
