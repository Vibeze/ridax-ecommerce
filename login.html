<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ridax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ridax: { DEFAULT: '#1b7a39', dark: '#135c29' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10 px-4">

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-black text-ridax tracking-tighter flex items-center justify-center gap-1 mb-2">
                <i class="fa-solid fa-leaf text-2xl"></i> RIDAX
            </a>
            <h2 class="text-xl font-bold text-gray-800">Welcome back</h2>
            <p class="text-sm text-gray-500 mt-1">Log in to your Ridax account.</p>
        </div>

        <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <div class="flex justify-between items-end mb-1">
                    <label class="block text-xs font-bold text-gray-700 uppercase">Password</label>
                    <a href="#" class="text-xs text-ridax hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-ridax outline-none bg-gray-50 focus:bg-white transition">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-ridax hover:bg-ridax-dark text-white font-bold py-3 rounded text-sm uppercase transition shadow-md mt-4">
                Log In
            </button>
        </form>

        <div class="mt-6 flex items-center">
            <div class="flex-1 border-t border-gray-200"></div>
            <span class="px-3 text-xs text-gray-400 uppercase font-bold">Or continue with</span>
            <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <button onclick="window.loginWithGoogle()" class="mt-6 w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-bold py-2.5 rounded text-sm transition shadow-sm">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Log in with Google
        </button>

        <div class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? <a href="signup.html" class="text-ridax font-bold hover:underline">Sign up</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let dbClient = null;
        if (window.supabase) {
            dbClient = window.supabase.createClient('https://gvhptxabpbpnabmxnuix.supabase.co', 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX');
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            if (!dbClient) return alert("Database connection failed. Please refresh the page.");

            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await dbClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;
                window.location.href = "index.html";

            } catch (err) {
                console.error("Login error:", err.message);
                alert("Invalid email or password.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.loginWithGoogle = async function() {
            if (!dbClient) return;
            const { data, error } = await dbClient.auth.signInWithOAuth({ provider: 'google' });
            if (error) alert("Google Sign-In is not yet configured.");
        };
    </script>
</body>
</html>
