<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PestZap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { pestzap: { DEFAULT: '#1b7a39', dark: '#135c29' } } } } }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10 px-4 relative">

    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-black text-pestzap tracking-tighter flex items-center justify-center gap-2 mb-2">
                <i class="fa-solid fa-shield-halved text-2xl"></i> PESTZAP
            </a>
            <h2 class="text-xl font-bold text-gray-800">Welcome back</h2>
            <p class="text-sm text-gray-500 mt-1">Log in to your PestZap account.</p>
        </div>

        <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-pestzap outline-none bg-gray-50 focus:bg-white transition">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-gray-700 uppercase">Password</label>
                    <a href="#" class="text-xs font-bold text-pestzap hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded px-3 py-2.5 text-sm focus:border-pestzap outline-none bg-gray-50 focus:bg-white transition">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-pestzap hover:bg-pestzap-dark text-white font-bold py-3 rounded text-sm uppercase transition shadow-md mt-2">
                Log In
            </button>
        </form>

        <div class="mt-6 flex items-center">
            <div class="flex-1 border-t border-gray-200"></div>
            <span class="px-3 text-xs text-gray-400 uppercase font-bold">Or continue with</span>
            <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <button onclick="window.loginWithGoogle()" class="mt-6 w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-bold py-2.5 rounded text-sm transition shadow-sm">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Log in with Google
        </button>

        <div class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? <a href="signup.html" class="text-pestzap font-bold hover:underline">Sign up</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            
            toast.className = `${bgColor} text-white px-5 py-3.5 rounded shadow-2xl transform transition-all duration-300 translate-x-full opacity-0 flex items-center gap-3 border-l-4 border-white/30`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-bold tracking-wide">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        };

        let dbClient = null;
        if (window.supabase) {
            dbClient = window.supabase.createClient('https://gvhptxabpbpnabmxnuix.supabase.co', 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX');
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            if (!dbClient) return window.showToast("Database connection failed. Please refresh.", "error");
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { error } = await dbClient.auth.signInWithPassword({ email: email, password: password });
                if (error) throw error;
                
                window.showToast("Login successful! Redirecting...");
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
            } catch (err) {
                window.showToast(err.message, "error");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.loginWithGoogle = async function() {
            if (!dbClient) return;
            const { error } = await dbClient.auth.signInWithOAuth({ provider: 'google' });
            if (error) window.showToast("Google Sign-In error.", "error");
        };
    </script>
</body>
</html>
