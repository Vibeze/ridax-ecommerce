<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Ridax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ridax: { DEFAULT: '#1b7a39', dark: '#135c29', light: '#e8f3ec', accent: '#f68b1e' } } }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f2f2f2] text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Top Bar matching index.html -->
    <div class="bg-green-900 text-white text-[11px] py-2 px-4 text-center tracking-wide font-medium">
        SECURE ADMIN PORTAL — AUTHORIZED PERSONNEL ONLY
    </div>

    <!-- Header matching index.html -->
    <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100">
        <div class="max-w-[1400px] mx-auto px-4 py-4 flex items-center justify-between gap-6">
            <a href="index.html" class="text-2xl md:text-3xl font-black text-ridax tracking-tighter flex items-center gap-2 shrink-0">
                <i class="fa-solid fa-leaf text-xl md:text-2xl"></i> RIDAX <span class="text-gray-300 font-light hidden md:inline">|</span> <span class="text-gray-500 text-lg md:text-xl font-bold">Admin</span>
            </a>
            <div class="flex items-center gap-4 md:gap-6 shrink-0">
                <a href="index.html" class="text-sm font-bold text-gray-500 hover:text-ridax transition flex items-center gap-2">
                    <i class="fa-solid fa-store"></i> <span class="hidden md:inline">Live Store</span>
                </a>
                <button onclick="window.handleLogout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden md:inline">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-[1400px] w-full mx-auto px-4 py-8">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-md shadow-sm border border-gray-100 border-l-4 border-l-blue-500 flex items-center justify-between">
                <div>
                    <div class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Total Orders</div>
                    <div class="text-3xl font-black text-gray-900" id="statTotalOrders">0</div>
                </div>
                <i class="fa-solid fa-box-open text-4xl text-gray-100"></i>
            </div>
            <div class="bg-white p-6 rounded-md shadow-sm border border-gray-100 border-l-4 border-l-orange-500 flex items-center justify-between">
                <div>
                    <div class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Pending Processing</div>
                    <div class="text-3xl font-black text-orange-500" id="statPending">0</div>
                </div>
                <i class="fa-solid fa-clock-rotate-left text-4xl text-gray-100"></i>
            </div>
            <div class="bg-white p-6 rounded-md shadow-sm border border-gray-100 border-l-4 border-l-ridax flex items-center justify-between">
                <div>
                    <div class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Total Revenue</div>
                    <div class="text-3xl font-black text-ridax" id="statRevenue">₦0</div>
                </div>
                <i class="fa-solid fa-chart-line text-4xl text-gray-100"></i>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-md shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-800 uppercase text-sm tracking-wide">Recent Customer Orders</h2>
                <button onclick="window.loadAdminData()" class="text-ridax hover:text-ridax-dark text-sm font-bold flex items-center gap-2 bg-white px-3 py-1.5 rounded border border-gray-200 shadow-sm transition">
                    <i class="fa-solid fa-rotate-right"></i> Refresh Data
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-white text-[11px] text-gray-500 uppercase tracking-wider border-b border-gray-200">
                            <th class="p-4 font-bold">Order Details</th>
                            <th class="p-4 font-bold">Customer Info</th>
                            <th class="p-4 font-bold">Delivery Location</th>
                            <th class="p-4 font-bold">Payment</th>
                            <th class="p-4 font-bold text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersContainer" class="divide-y divide-gray-100 text-sm">
                        <tr>
                            <td colspan="5" class="p-12 text-center text-gray-400">
                                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-ridax"></i>
                                <div class="font-medium">Connecting to secure database...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- ADMIN SECURITY CONFIGURATION ---
        // Add as many emails to this list as you need. Only these emails can view this page.
        const ADMIN_EMAILS = [
            "chibuikethankgod134@gmail.com", // Master Admin
            "lawrence_placeholder@gmail.com" // Add client's email here later
        ];

        let dbClient = null;
        if (window.supabase) {
            dbClient = window.supabase.createClient('https://gvhptxabpbpnabmxnuix.supabase.co', 'sb_publishable_6-h6NZgscbbKXFbFnEbBXQ_tduRBaIX');
        }

        window.loadAdminData = async function() {
            if (!dbClient) return;

            try {
                // 1. Strict Security Check
                const { data: { user }, error: authError } = await dbClient.auth.getUser();
                if (authError || !user) {
                    window.location.href = 'login.html';
                    return;
                }
                
                // Block non-admins
                if (!ADMIN_EMAILS.includes(user.email)) {
                    document.body.innerHTML = `
                        <div class="min-h-screen flex items-center justify-center bg-[#f2f2f2] px-4">
                            <div class="bg-white p-8 rounded-lg shadow-xl text-center max-w-md border border-gray-100">
                                <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                    <i class="fa-solid fa-shield-halved text-red-500 text-4xl"></i>
                                </div>
                                <h2 class="text-2xl font-black text-gray-900 mb-2">Access Denied</h2>
                                <p class="text-sm text-gray-500 mb-8 leading-relaxed">Your account (${user.email}) does not have authorized administrator privileges to view this portal.</p>
                                <a href="index.html" class="block w-full bg-ridax hover:bg-ridax-dark text-white font-bold py-3 rounded text-sm uppercase transition shadow-md">Return to Storefront</a>
                            </div>
                        </div>`;
                    return;
                }

                // 2. Fetch All Orders
                const { data: orders, error: ordersError } = await dbClient
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (ordersError) throw ordersError;

                // 3. Calculate Stats
                document.getElementById('statTotalOrders').innerText = orders.length;
                document.getElementById('statPending').innerText = orders.filter(o => o.status === 'pending').length;
                const totalRev = orders.reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
                document.getElementById('statRevenue').innerText = '₦' + totalRev.toLocaleString();

                // 4. Render Table
                const container = document.getElementById('adminOrdersContainer');
                if (orders.length === 0) {
                    container.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-gray-500"><div class="text-4xl mb-3">📭</div><div class="font-bold">No orders yet.</div><div class="text-xs text-gray-400 mt-1">When customers buy products, they will appear here.</div></td></tr>`;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const date = new Date(order.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const statusColor = order.status === 'pending' ? 'bg-orange-100 text-orange-700 border border-orange-200' : 'bg-green-100 text-green-700 border border-green-200';
                    const payBadge = order.payment_method === 'card' 
                        ? '<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-blue-100">Paystack</span>' 
                        : '<span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-gray-200">Pay on Delivery</span>';
                    
                    return `
                        <tr class="hover:bg-gray-50 transition group">
                            <td class="p-4 align-top">
                                <div class="font-bold text-gray-900 text-xs">${order.payment_reference}</div>
                                <div class="text-[11px] text-gray-500 mt-1">${date}</div>
                            </td>
                            <td class="p-4 align-top">
                                <div class="font-bold text-gray-800 capitalize">${order.customer_name}</div>
                                <div class="text-xs text-gray-500 mt-0.5"><a href="mailto:${order.customer_email}" class="hover:text-ridax">${order.customer_email}</a></div>
                                <div class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-phone text-[10px] text-gray-400"></i> ${order.customer_phone}</div>
                            </td>
                            <td class="p-4 align-top max-w-[200px]">
                                <div class="font-bold text-gray-800 text-xs uppercase tracking-wide">${order.state}</div>
                                <div class="text-xs text-gray-600 mt-0.5 line-clamp-2">${order.delivery_address}</div>
                            </td>
                            <td class="p-4 align-top">
                                <div class="font-bold text-ridax text-base mb-1">₦${Number(order.total_amount).toLocaleString()}</div>
                                ${payBadge}
                            </td>
                            <td class="p-4 align-top text-right">
                                <span class="${statusColor} text-[10px] font-bold px-2.5 py-1 rounded shadow-sm uppercase tracking-wider">${order.status}</span>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("Admin fetch error:", err);
                document.getElementById('adminOrdersContainer').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation mb-2 text-xl"></i><br>Error loading database.</td></tr>`;
            }
        };

        window.handleLogout = async function() {
            if (!dbClient) return;
            await dbClient.auth.signOut();
            window.location.href = 'login.html';
        };

        window.addEventListener('load', window.loadAdminData);
    </script>
</body>
</html>
